version: 0.2

phases:
  build:
    commands:
      - echo "Build started"
      - echo "Preparing application"

  post_build:
    commands:
      - echo "Uploading application to S3"
      - aws s3 cp index.html s3://YOUR-BUCKET-NAME/index.html

      - echo "Finding EC2 instance"
      - INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=CodePipeline-Deployment-Server" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)

      - echo "EC2 Instance ID: $INSTANCE_ID"

      - echo "Deploying application to EC2"
      - COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name "AWS-RunShellScript" --parameters 'commands=["sudo dnf install -y httpd","sudo systemctl enable httpd","sudo systemctl start httpd","aws s3 cp s3://YOUR-BUCKET-NAME/index.html /var/www/html/index.html"]' --query "Command.CommandId" --output text)

      - echo "Deployment Command ID: $COMMAND_ID"

      - sleep 10

      - aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

artifacts:
  files:
    - index.html
